services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: tradeq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradeq
      POSTGRES_PASSWORD: tradeq_secret
      POSTGRES_DB: tradeq_db
    ports:
      - "5432:5432"
    volumes:
      - tradeq_pgdata:/var/lib/postgresql/data
      - ./phase2/database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeq -d tradeq_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tradeq_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tradeq_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: tradeq_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  tradeq_pgdata:
    name: tradeq_pgdata
  tradeq_redis_data:
    name: tradeq_redis_data